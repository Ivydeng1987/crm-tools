<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>外贸CRM · 云端版 v2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f6fc;
            font-family: 'Inter', system-ui, sans-serif;
            padding: 2rem 1.8rem;
            color: #1c2d3f;
        }
        .lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(14, 75, 110, 0.95); backdrop-filter: blur(12px); z-index: 10000;
            display: flex; align-items: center; justify-content: center;
        }
        .lock-card {
            background: white; border-radius: 2rem; padding: 2rem; max-width: 400px; width: 90%; text-align: center;
        }
        .lock-card h2 { color: #0e4b6e; }
        .lock-input {
            width: 100%; padding: 0.9rem; border-radius: 60px; border: 1px solid #c4d6e8;
            margin: 1rem 0; text-align: center; font-size: 1rem;
        }
        .lock-btn {
            background: #0e4b6e; color: white; border: none; padding: 0.8rem;
            border-radius: 60px; width: 100%; cursor: pointer; font-weight: 600;
        }
        .lock-btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .lock-error { color: #ba4b4b; margin-top: 0.8rem; }
        .main-app { display: none; max-width: 1600px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1.2rem; margin-bottom: 2rem; }
        .logo-area { display: flex; align-items: center; gap: 1rem; }
        .logo-icon { background: #0e4b6e; color: white; width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        .title h1 { font-size: 2rem; font-weight: 600; }
        .title span { background: #e1edf7; color: #0e4b6e; padding: 0.2rem 1.2rem; border-radius: 30px; font-size: 0.85rem; }
        .stats { background: white; padding: 0.9rem 2rem; border-radius: 60px; display: flex; gap: 2rem; flex-wrap: wrap; }
        .stat-item { display: flex; align-items: center; gap: 0.7rem; }
        .stat-value { font-weight: 700; font-size: 1.5rem; color: #103f5c; }
        .stat-label { color: #54738f; }
        .stat-item.warn .stat-value { color: #ac3f3f; }

        .main-card { background: white; border-radius: 32px; padding: 2rem; margin-bottom: 2rem; }
        .toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1.5rem; margin-bottom: 2rem; }
        .search-area { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
        .search-box { background: #f3f9ff; border-radius: 48px; display: flex; align-items: center; padding-left: 1.5rem; border: 1px solid #cde0ed; }
        .search-box input { border: none; background: transparent; padding: 0.75rem 1rem; width: 220px; outline: none; }
        .search-box button { background: #0e4b6e; border: none; color: white; padding: 0.5rem 1.8rem; border-radius: 40px; cursor: pointer; }
        .filter-select { padding: 0.6rem 1rem; border-radius: 40px; border: 1px solid #cde0ed; background: white; font-size: 0.85rem; }
        .btn-secondary { background: white; border: 1px solid #b9d2e7; color: #1f4a66; padding: 0.6rem 1.5rem; border-radius: 40px; cursor: pointer; }
        .btn-primary { background: #0e4b6e; color: white; border: none; padding: 0.8rem 2.2rem; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .btn-export { background: #2d6e4b; color: white; border: none; padding: 0.8rem 2rem; border-radius: 40px; cursor: pointer; }
        .btn-import { background: #8a6d3b; color: white; border: none; padding: 0.8rem 2rem; border-radius: 40px; cursor: pointer; }
        .btn-backup { background: #54738f; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 40px; cursor: pointer; }
        .change-pwd-btn { background: #54738f; color: white; border: none; padding: 0.5rem 1rem; border-radius: 40px; font-size: 0.8rem; cursor: pointer; margin-left: 0.5rem; }
        
        .table-wrapper { overflow-x: auto; border-radius: 24px; border: 1px solid #e3eff8; margin: 1.8rem 0 1rem; }
        table { width: 100%; border-collapse: collapse; min-width: 1100px; background: white; font-size: 0.9rem; }
        th { background: #f0f7fd; padding: 1rem 0.8rem; font-weight: 600; color: #1f4d6e; text-align: left; }
        td { padding: 0.8rem; border-bottom: 1px solid #e7f0f7; vertical-align: middle; }
        .client-name { font-weight: 600; }
        .badge { display: inline-block; padding: 0.3rem 0.8rem; border-radius: 30px; font-size: 0.75rem; margin: 2px 0; }
        .intent-high { background: #ffebe7; color: #ac3f3f; }
        .intent-mid { background: #e2f0e8; color: #1b7355; }
        .source-badge { background: #e1d7f0; color: #4f378b; }
        .level-gold { background: #f8e3b3; color: #8b6b2b; }
        .cls-lead { background: #e0edfb; color: #1f5fa8; }
        .cls-sample { background: #fdeecb; color: #96650f; }
        .cls-repeat { background: #dcf5e3; color: #157a45; }
        .cls-manual { border: 1px dashed #94a3b8; }
        .remind-badge { background: #ffe0e0; color: #b23c3c; }
        .action-icons i { font-size: 1.2rem; color: #57809f; margin: 0 6px; cursor: pointer; }
        .action-icons i:hover { color: #0e4b6e; }
        .checkbox-col { width: 40px; text-align: center; }
        .row-deleted { opacity: 0.45; }
        
        .form-panel {
            background: #f9fdff; border-radius: 32px; padding: 2rem;
            margin-top: 2rem; border: 1px solid #d3e6f5;
        }
        .form-title { font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; color: #13445f; }
        .grid-3 {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .form-group label { font-size: 0.7rem; font-weight: 600; color: #3f688b; display: block; margin-bottom: 3px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 0.6rem; border: 1px solid #c4d6e8;
            border-radius: 16px; font-size: 0.85rem;
        }
        .btn-group { display: flex; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; }
        .footer-note { text-align: center; margin-top: 2rem; color: #5d7f9a; }
        .sync-status {
            background: #e6f3fa; padding: 8px 16px; border-radius: 40px;
            font-size: 0.75rem; display: inline-flex; align-items: center; gap: 0.5rem;
        }
        .save-toast {
            position: fixed; bottom: 30px; right: 30px; background: #0e4b6e; color: white;
            padding: 12px 24px; border-radius: 50px; z-index: 9999;
            transform: translateY(100px); opacity: 0; transition: 0.3s;
        }
        .save-toast.show { transform: translateY(0); opacity: 1; }
        .save-toast.error { background: #ac3f3f; }
        #importFile { display: none; }
        .cloud-icon { color: #2d6e4b; margin-right: 4px; }
        .hint-box { background: #fff8e6; border: 1px solid #f0d999; border-radius: 16px; padding: 0.8rem 1.2rem; font-size: 0.8rem; color: #7a5c14; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div id="lockScreen" class="lock-screen">
        <div class="lock-card">
            <h2><i class="fas fa-lock"></i> 外贸CRM</h2>
            <p>请输入密码</p>
            <input type="password" id="passwordInput" class="lock-input" placeholder="密码" autofocus>
            <button id="unlockBtn" class="lock-btn" disabled>正在校验云端密码...</button>
            <div id="lockError" class="lock-error"></div>
        </div>
    </div>

    <div id="mainApp" class="main-app">
        <div class="container">
            <div id="saveToast" class="save-toast"><i class="fas fa-cloud-upload-alt"></i> 已同步到云端</div>
            
            <div class="header">
                <div class="logo-area">
                    <div class="logo-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                    <div class="title">
                        <h1>刀具·泵阀 CRM <button id="changePwdBtn" class="change-pwd-btn"><i class="fas fa-key"></i> 修改密码</button></h1>
                        <span><i class="fas fa-database"></i> 云端同步 | 多设备自动同步</span>
                    </div>
                </div>
                <div class="stats">
                    <div class="stat-item"><span class="stat-value" id="totalClients">0</span> <span class="stat-label">总客户</span></div>
                    <div class="stat-item"><span class="stat-value" id="hotLeads">0</span> <span class="stat-label">高意向</span></div>
                    <div class="stat-item"><span class="stat-value" id="dueTodayCount">0</span> <span class="stat-label">今日待跟进</span></div>
                    <div class="stat-item warn"><span class="stat-value" id="lapsedCount">0</span> <span class="stat-label">老客户需跟进</span></div>
                </div>
            </div>

            <div class="main-card">
                <div class="toolbar">
                    <div class="search-area">
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchInput" placeholder="搜索姓名/公司/行业...">
                            <button id="searchBtn">筛选</button>
                        </div>
                        <select class="filter-select" id="classFilter">
                            <option value="">全部分类</option>
                            <option value="潜在客户">潜在客户</option>
                            <option value="样品客户">样品客户</option>
                            <option value="老客户">老客户</option>
                        </select>
                        <button class="btn-secondary" id="clearSearchBtn"><i class="fas fa-redo-alt"></i> 重置</button>
                        <button class="btn-export" id="exportAllBtn"><i class="fas fa-file-excel"></i> 导出Excel</button>
                        <button class="btn-import" id="importBtn"><i class="fas fa-file-import"></i> 导入Excel</button>
                        <button class="btn-backup" id="backupBtn"><i class="fas fa-shield-alt"></i> 备份全部数据</button>
                        <div id="syncStatus" class="sync-status"><i class="fas fa-cloud-upload-alt cloud-icon"></i> 同步中...</div>
                    </div>
                    <button class="btn-primary" id="showAddFormBtn"><i class="fas fa-plus-circle"></i> 新增客户</button>
                </div>

                <input type="file" id="importFile" accept=".xlsx,.xls">

                <div class="table-wrapper">
                    <table id="clientTable">
                        <thead> <tr><th class="checkbox-col"><input type="checkbox" id="selectAllCheckbox"></th><th>客户/公司</th><th>分类</th><th>行业</th><th>等级/意向</th><th>来源</th><th>最近跟进</th><th>下次跟进</th><th>操作</th></tr> </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="form-panel" id="formPanel" style="display: none;">
                <div class="form-title" id="formTitleText">新增外贸客户</div>
                <div class="hint-box"><i class="fas fa-info-circle"></i> 客户分类（潜在/样品/老客户）会根据"关联下单系统客户"自动统计下单次数计算：0单=潜在客户，1单=样品客户，2单及以上=老客户。也可以手动改成固定值，覆盖自动判断（适合下单系统里还没补录的老客户历史数据）。</div>
                <div class="grid-3">
                    <div class="form-group"><label>姓名 *</label><input type="text" id="clientName"></div>
                    <div class="form-group"><label>公司</label><input type="text" id="company"></div>
                    <div class="form-group"><label>关联下单系统客户（用于自动统计订单）</label><select id="linkedCustomerSelect"><option value="">-- 不关联 --</option></select></div>
                    <div class="form-group"><label>国家</label><input type="text" id="country" value="China"></div>
                    <div class="form-group"><label>主营行业</label><input type="text" id="industry"></div>
                    <div class="form-group"><label>产品线</label><input type="text" id="productLine"></div>
                    <div class="form-group"><label>规模</label><select id="scale"><option>1-10人</option><option>11-50人</option><option>51-200人</option><option>201-500人</option><option>500+人</option></select></div>
                    <div class="form-group"><label>客户等级</label><select id="clientLevel"><option>钻石⭐</option><option>金牌🥇</option><option>银牌🥈</option><option>基础⚪</option></select></div>
                    <div class="form-group"><label>意向等级</label><select id="intention"><option>高意向🔥</option><option>中意向⭐</option><option>低意向🍃</option></select></div>
                    <div class="form-group"><label>客户来源</label><select id="source"><option>展会</option><option>网络搜索</option><option>客户推荐</option><option>社交媒体</option><option>官网</option><option>B端平台</option></select></div>
                    <div class="form-group"><label>分类覆盖（不选=自动判断）</label><select id="classOverride"><option value="">-- 自动判断 --</option><option value="潜在客户">强制：潜在客户</option><option value="样品客户">强制：样品客户</option><option value="老客户">强制：老客户</option></select></div>
                    <div class="form-group"><label>老客户跟进周期（天）</label><input type="number" id="followUpCycleDays" placeholder="如：90"></div>
                    <div class="form-group"><label>邮箱</label><input type="email" id="email"></div>
                    <div class="form-group"><label>电话</label><input type="text" id="phone"></div>
                    <div class="form-group"><label>下次跟进</label><input type="date" id="nextFollowDate"></div>
                    <div class="form-group"><label>下一步动作</label><input type="text" id="nextAction"></div>
                    <input type="hidden" id="editId">
                </div>
                <div class="form-group" style="margin-bottom:1rem;"><label>新增一条跟进记录（会追加到历史，不会覆盖之前的）</label><textarea id="followNote" rows="2" placeholder="这次跟进聊了什么..."></textarea></div>
                <div id="followHistoryBox"></div>
                <div class="btn-group">
                    <button class="btn-primary" id="saveClientBtn">保存</button>
                    <button class="btn-secondary" id="cancelFormBtn">取消</button>
                </div>
            </div>

            <div class="footer-note">🔒 云端同步 | 任何电脑打开自动同步 | 换电脑数据不丢失</div>
        </div>
    </div>

    <script>
        // ========== 配置（Key已藏进Worker，不再暴露）==========
        const BIN_ID = "69ca405a36566621a85fc22b";
        const CUSTOMER_ORDER_BIN_ID = "6a7e7e1bda38895dfee28007"; // 客户下单系统Bin（只读，用于统计订单次数）
        const WORKER_URL = "https://sunlit-proxy.ivy-3fc.workers.dev";
        const ACCESS_TOKEN = "RBhCP4O1yvwxN7nB9oMoQCzuj2ZnF3M9daOE76fRVtk";

        let currentPwd = localStorage.getItem("crm_password") || "admin123";
        let clients = [];
        let searchKeyword = "";
        let classFilterValue = "";
        let editId = null;
        let customerOrderCache = null; // 缓存下单系统的订单+客户目录，避免重复拉取

        function unlock() {
            let pwd = document.getElementById("passwordInput").value;
            if (pwd === currentPwd) {
                document.getElementById("lockScreen").style.display = "none";
                document.getElementById("mainApp").style.display = "block";
                initCRM();
            } else {
                document.getElementById("lockError").innerText = "❌ 密码错误";
            }
        }

        async function changePwd() {
            let old = prompt("当前密码:");
            if (old !== currentPwd) { alert("密码错误"); return; }
            let newp = prompt("新密码(至少4位):");
            if (!newp || newp.length < 4) { alert("至少4位"); return; }
            let confirmp = prompt("确认新密码:");
            if (newp !== confirmp) { alert("不一致"); return; }
            currentPwd = newp;
            localStorage.setItem("crm_password", currentPwd);
            await saveToCloud();
            alert("✅ 密码修改成功，已同步到云端");
        }

        // ========== 云端同步（走Worker中转，不暴露真实Key）==========
        async function loadFromCloud() {
            try {
                const response = await fetch(`${WORKER_URL}/bin/${BIN_ID}/latest`, {
                    headers: { 'X-Access-Token': ACCESS_TOKEN }
                });
                if (response.ok) {
                    const data = await response.json();
                    let record = data.record;
                    if (record && typeof record === 'object' && !Array.isArray(record)) {
                        clients = Array.isArray(record.clients) ? record.clients : [];
                        if (record.password) {
                            currentPwd = record.password;
                            localStorage.setItem("crm_password", currentPwd);
                        }
                    } else if (Array.isArray(record)) {
                        // 兼容旧格式：云端之前直接存的是客户数组
                        clients = record;
                    }
                    saveLocal();
                    render();
                    updateSyncStatus(true, "已同步云端");
                } else {
                    throw new Error("加载失败");
                }
            } catch (e) {
                console.log("加载云端失败，使用本地备份", e);
                loadLocal();
                updateSyncStatus(false, "离线模式");
            }
        }

        async function saveToCloud() {
            try {
                const response = await fetch(`${WORKER_URL}/bin/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Access-Token': ACCESS_TOKEN
                    },
                    body: JSON.stringify({ password: currentPwd, clients: clients })
                });
                if (response.ok) {
                    updateSyncStatus(true, "已同步云端");
                    showToast("已同步到云端");
                } else {
                    updateSyncStatus(false, "同步失败");
                }
            } catch (e) {
                console.error("保存失败", e);
                updateSyncStatus(false, "同步失败");
            }
        }

        function saveLocal() { localStorage.setItem("crm_backup", JSON.stringify(clients)); }
        function loadLocal() {
            const stored = localStorage.getItem("crm_backup");
            if (stored) clients = JSON.parse(stored);
            else clients = [];
            render();
        }

        function backupAllData() {
            let payload = { exportedAt: new Date().toISOString(), clients };
            let blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = `外贸CRM_备份_${getToday()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('备份文件已下载');
        }

        // ========== 只读拉取客户下单系统数据（用于自动统计订单次数）==========
        async function fetchCustomerOrderData() {
            if (customerOrderCache) return customerOrderCache;
            try {
                let res = await fetch(`${WORKER_URL}/bin/${CUSTOMER_ORDER_BIN_ID}/latest`, { headers: { 'X-Access-Token': ACCESS_TOKEN } });
                if (res.ok) {
                    let json = await res.json();
                    let r = json.record;
                    if (r && typeof r === 'object') {
                        customerOrderCache = {
                            orders: Array.isArray(r.orders) ? r.orders : [],
                            customers: Array.isArray(r.customers) ? r.customers : []
                        };
                        return customerOrderCache;
                    }
                }
            } catch (e) { console.error('拉取下单系统数据失败:', e); }
            customerOrderCache = { orders: [], customers: [] };
            return customerOrderCache;
        }

        function updateSyncStatus(isOnline, msg) {
            const el = document.getElementById("syncStatus");
            if (isOnline) {
                el.innerHTML = '<i class="fas fa-cloud-upload-alt cloud-icon"></i> ' + msg;
                el.style.background = "#d9e6cf";
            } else {
                el.innerHTML = '<i class="fas fa-database"></i> ' + msg;
                el.style.background = "#f0e2d4";
            }
        }

        function showToast(msg, type) {
            const toast = document.getElementById("saveToast");
            toast.innerHTML = '<i class="fas fa-check-circle"></i> ' + msg;
            toast.className = 'save-toast' + (type === 'error' ? ' error' : '');
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2500);
        }

        function getToday() { return new Date().toISOString().slice(0,10); }
        function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }
        function escapeHtml(str) { if(!str) return ''; return String(str).replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':m==='>'?'&gt;':m); }

        // ========== 客户分类 + 老客户跟进提醒 ==========
        // 根据关联的下单系统客户名，统计真实订单次数：0单=潜在客户，1单=样品客户，2单及以上=老客户
        function computeOrderStats(linkedCompany) {
            if (!linkedCompany || !customerOrderCache) return { count: 0, lastOrderDate: null };
            let matching = customerOrderCache.orders.filter(o => !o.deleted && o.customerCompany === linkedCompany);
            let count = matching.length;
            let lastOrderDate = matching.reduce((max, o) => {
                let d = o.orderDate || '';
                return d > max ? d : max;
            }, '');
            return { count, lastOrderDate: lastOrderDate || null };
        }

        function computeClassification(client) {
            if (client.classOverride) return { label: client.classOverride, manual: true, orderCount: null, lastOrderDate: null };
            let stats = computeOrderStats(client.linkedCustomerCompany);
            let label = stats.count === 0 ? '潜在客户' : (stats.count === 1 ? '样品客户' : '老客户');
            return { label, manual: false, orderCount: stats.count, lastOrderDate: stats.lastOrderDate };
        }

        function needsFollowUpReminder(client, classification, today) {
            if (classification.label !== '老客户') return false;
            if (!client.followUpCycleDays) return false;
            let lastOrderDate = classification.lastOrderDate;
            if (!lastOrderDate) return false;
            let daysSince = Math.floor((new Date(today) - new Date(lastOrderDate)) / 86400000);
            return daysSince > parseInt(client.followUpCycleDays);
        }

        function classBadgeClass(label) {
            if (label === '潜在客户') return 'cls-lead';
            if (label === '样品客户') return 'cls-sample';
            return 'cls-repeat';
        }

        // ========== 关联客户选择器（从下单系统客户库拉取）==========
        async function populateLinkedCustomerSelect() {
            let data = await fetchCustomerOrderData();
            let sel = document.getElementById('linkedCustomerSelect');
            let current = sel.value;
            sel.innerHTML = '<option value="">-- 不关联 --</option>' +
                data.customers.map(c => `<option value="${escapeHtml(c.company)}">${escapeHtml(c.shortName ? c.shortName + ' - ' : '')}${escapeHtml(c.company)}</option>`).join('');
            sel.value = current;
        }

        // ========== 渲染列表 ==========
        async function render() {
            await fetchCustomerOrderData(); // 确保有数据用于分类计算（有缓存的话很快）
            let filtered = clients.filter(c => !c.deleted);
            if (searchKeyword) {
                let kw = searchKeyword.toLowerCase();
                filtered = filtered.filter(c => (c.name||'').toLowerCase().includes(kw) || (c.company && c.company.toLowerCase().includes(kw)) || (c.industry && c.industry.toLowerCase().includes(kw)));
            }
            let today = getToday();

            // 先计算好每个客户的分类和提醒状态，用于筛选和统计
            let enriched = filtered.map(c => {
                let cls = computeClassification(c);
                let remind = needsFollowUpReminder(c, cls, today);
                return { c, cls, remind };
            });

            if (classFilterValue) {
                enriched = enriched.filter(x => x.cls.label === classFilterValue);
            }

            let html = "";
            enriched.forEach(({c, cls, remind}) => {
                let intentClass = c.intention.includes("高") ? "intent-high" : "intent-mid";
                let levelClass = c.clientLevel.includes("金") ? "level-gold" : "";
                let clsBadge = `<span class="badge ${classBadgeClass(cls.label)} ${cls.manual ? 'cls-manual' : ''}">${cls.label}${cls.manual ? ' (手动)' : ''}</span>`;
                let remindBadge = remind ? `<span class="badge remind-badge">⚠️ 需跟进</span>` : '';
                let followHistory = Array.isArray(c.followHistory) ? c.followHistory : [];
                let lastFollow = followHistory.length ? followHistory[followHistory.length - 1] : null;
                html += `<tr>
                    <td class="checkbox-col"><input type="checkbox" class="client-checkbox" value="${c.id}"></td>
                    <td><strong>${escapeHtml(c.name)}</strong><br><small>${escapeHtml(c.company) || '—'} | ${escapeHtml(c.country)}</small></td>
                    <td>${clsBadge}${remindBadge ? '<br>' + remindBadge : ''}</td>
                    <td>${escapeHtml(c.industry) || '—'}<br><small>${escapeHtml(c.productLine) || ''}</small></td>
                    <td><span class="badge ${levelClass}">${escapeHtml(c.clientLevel)}</span> <span class="badge ${intentClass}">${escapeHtml(c.intention)}</span></td>
                    <td><span class="badge source-badge">${escapeHtml(c.source) || '展会'}</span></td>
                    <td>${lastFollow ? formatDate(lastFollow.date) : '—'}<br><small>${lastFollow ? escapeHtml((lastFollow.note||'').substring(0,20)) : ''}</small></td>
                    <td>${c.nextFollowDate || '—'}${c.nextFollowDate === today ? ' 🔔' : (c.nextFollowDate && c.nextFollowDate < today ? ' ⚠️' : '')}</td>
                    <td class="action-icons"><i class="fas fa-edit" onclick="editClient('${c.id}')"></i><i class="fas fa-clock" onclick="quickFollow('${c.id}')"></i><i class="fas fa-trash-alt" onclick="deleteClient('${c.id}')"></i></td>
                </tr>`;
            });
            document.getElementById("tableBody").innerHTML = html || '<tr><td colspan="9" style="text-align:center;">暂无客户</td></tr>';
            document.getElementById("totalClients").innerText = filtered.length;
            document.getElementById("hotLeads").innerText = filtered.filter(c => c.intention.includes("高")).length;
            document.getElementById("dueTodayCount").innerText = filtered.filter(c => c.nextFollowDate === today).length;
            document.getElementById("lapsedCount").innerText = enriched.filter(x => x.remind).length;
        }

        function formatDate(d) { return d ? new Date(d).toLocaleDateString('zh-CN') : '—'; }

        // ========== 表单 ==========
        async function resetForm() {
            document.getElementById("clientName").value = "";
            document.getElementById("company").value = "";
            await populateLinkedCustomerSelect();
            document.getElementById("linkedCustomerSelect").value = "";
            document.getElementById("country").value = "China";
            document.getElementById("industry").value = "";
            document.getElementById("productLine").value = "";
            document.getElementById("scale").value = "11-50人";
            document.getElementById("clientLevel").value = "基础⚪";
            document.getElementById("intention").value = "中意向⭐";
            document.getElementById("source").value = "展会";
            document.getElementById("classOverride").value = "";
            document.getElementById("followUpCycleDays").value = "";
            document.getElementById("email").value = "";
            document.getElementById("phone").value = "";
            document.getElementById("nextFollowDate").value = "";
            document.getElementById("nextAction").value = "";
            document.getElementById("followNote").value = "";
            document.getElementById("followHistoryBox").innerHTML = "";
            editId = null;
            document.getElementById("editId").value = "";
            document.getElementById("formTitleText").innerText = "新增外贸客户";
            document.getElementById("formPanel").style.display = "none";
        }

        function renderFollowHistory(followHistory) {
            let box = document.getElementById("followHistoryBox");
            if (!followHistory || !followHistory.length) {
                box.innerHTML = '<div class="form-group"><label>历史跟进记录</label><div style="color:#94a3b8;font-size:0.85rem;">暂无历史记录</div></div>';
                return;
            }
            let items = followHistory.slice().reverse().map(f => `
                <div style="padding:8px 12px;border-bottom:1px solid #eef4f9;font-size:0.85rem;">
                    <b>${formatDate(f.date)}</b>　${escapeHtml(f.note || '')}
                </div>
            `).join('');
            box.innerHTML = `<div class="form-group"><label>历史跟进记录（共${followHistory.length}条，最新在上）</label><div style="max-height:180px;overflow-y:auto;border:1px solid #e3eff8;border-radius:12px;">${items}</div></div>`;
        }

        async function saveClient() {
            let name = document.getElementById("clientName").value.trim();
            if (!name) { alert("姓名不能为空"); return; }

            let existing = editId ? clients.find(c => c.id === editId) : null;
            let followHistory = existing && Array.isArray(existing.followHistory) ? existing.followHistory.slice() : [];
            let newNote = document.getElementById("followNote").value.trim();
            if (newNote) {
                followHistory.push({ date: getToday(), note: newNote });
            }

            let client = {
                id: editId || genId(),
                name: name,
                company: document.getElementById("company").value.trim(),
                linkedCustomerCompany: document.getElementById("linkedCustomerSelect").value,
                country: document.getElementById("country").value.trim(),
                industry: document.getElementById("industry").value.trim(),
                productLine: document.getElementById("productLine").value.trim(),
                scale: document.getElementById("scale").value,
                clientLevel: document.getElementById("clientLevel").value,
                intention: document.getElementById("intention").value,
                source: document.getElementById("source").value,
                classOverride: document.getElementById("classOverride").value,
                followUpCycleDays: document.getElementById("followUpCycleDays").value,
                email: document.getElementById("email").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                nextFollowDate: document.getElementById("nextFollowDate").value,
                nextAction: document.getElementById("nextAction").value.trim(),
                followHistory: followHistory,
                deleted: existing ? existing.deleted : false,
                deletedAt: existing ? existing.deletedAt : null
            };
            if (editId) {
                let idx = clients.findIndex(c => c.id === editId);
                if (idx !== -1) clients[idx] = client;
            } else {
                clients.push(client);
            }
            saveLocal();
            await saveToCloud();
            await render();
            resetForm();
            showToast("已保存并同步云端");
        }

        window.editClient = async function(id) {
            let c = clients.find(c => c.id === id);
            if (!c) return;
            await populateLinkedCustomerSelect();
            document.getElementById("clientName").value = c.name;
            document.getElementById("company").value = c.company || "";
            document.getElementById("linkedCustomerSelect").value = c.linkedCustomerCompany || "";
            document.getElementById("country").value = c.country || "China";
            document.getElementById("industry").value = c.industry || "";
            document.getElementById("productLine").value = c.productLine || "";
            document.getElementById("scale").value = c.scale || "11-50人";
            document.getElementById("clientLevel").value = c.clientLevel;
            document.getElementById("intention").value = c.intention;
            document.getElementById("source").value = c.source || "展会";
            document.getElementById("classOverride").value = c.classOverride || "";
            document.getElementById("followUpCycleDays").value = c.followUpCycleDays || "";
            document.getElementById("email").value = c.email || "";
            document.getElementById("phone").value = c.phone || "";
            document.getElementById("nextFollowDate").value = c.nextFollowDate || "";
            document.getElementById("nextAction").value = c.nextAction || "";
            document.getElementById("followNote").value = "";
            renderFollowHistory(c.followHistory);
            editId = c.id;
            document.getElementById("editId").value = c.id;
            document.getElementById("formTitleText").innerText = "编辑客户";
            document.getElementById("formPanel").style.display = "block";
            window.scrollTo({ top: document.getElementById("formPanel").offsetTop - 20, behavior: 'smooth' });
        };

        // 删除改为软删除（打标记，不真的抹掉），避免误删无法找回
        window.deleteClient = async function(id) {
            if (confirm("确定删除？（删除后数据仍保留，可联系恢复，不会真的从云端抹掉）")) {
                let idx = clients.findIndex(c => c.id === id);
                if (idx !== -1) { clients[idx].deleted = true; clients[idx].deletedAt = getToday(); }
                saveLocal();
                await saveToCloud();
                await render();
                showToast("已删除");
            }
        };

        window.quickFollow = async function(id) {
            let c = clients.find(c => c.id === id);
            if (!c) return;
            let note = prompt("这次跟进聊了什么（会追加到历史记录，不会覆盖之前的）:");
            if (note === null || !note.trim()) return;
            if (!Array.isArray(c.followHistory)) c.followHistory = [];
            c.followHistory.push({ date: getToday(), note: note.trim() });
            let newDate = prompt("下次跟进日期（可留空不改）:", c.nextFollowDate || "");
            if (newDate !== null && newDate.trim()) c.nextFollowDate = newDate.trim();
            saveLocal();
            await saveToCloud();
            await render();
            showToast("已更新跟进记录");
        };

        // ========== Excel导出/导入 ==========
        function exportExcel() {
            let visible = clients.filter(c => !c.deleted);
            if (!visible.length) { alert("无数据"); return; }
            let headers = ["姓名","公司","国家","行业","产品线","规模","等级","意向","来源","分类","邮箱","电话","下次跟进","下一步动作","最新跟进记录"];
            let data = visible.map(c => {
                let cls = computeClassification(c);
                let lastFollow = Array.isArray(c.followHistory) && c.followHistory.length ? c.followHistory[c.followHistory.length - 1] : null;
                return [c.name, c.company, c.country, c.industry, c.productLine, c.scale, c.clientLevel, c.intention, c.source, cls.label, c.email, c.phone, c.nextFollowDate, c.nextAction, lastFollow ? `${lastFollow.date} ${lastFollow.note}` : ''];
            });
            let ws = XLSX.utils.aoa_to_sheet([headers, ...data]);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "客户");
            XLSX.writeFile(wb, `客户_${getToday()}.xlsx`);
        }

        function importExcel(file) {
            let reader = new FileReader();
            reader.onload = async function(e) {
                let wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
                let ws = wb.Sheets[wb.SheetNames[0]];
                let rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
                if (rows.length < 2) { alert("无数据"); return; }
                let imported = [];
                for (let i = 1; i < rows.length; i++) {
                    let r = rows[i];
                    if (r[0]) {
                        imported.push({
                            id: genId(),
                            name: String(r[0]).trim(),
                            company: r[1] ? String(r[1]).trim() : "",
                            linkedCustomerCompany: "",
                            country: r[2] ? String(r[2]).trim() : "",
                            industry: r[3] ? String(r[3]).trim() : "",
                            productLine: r[4] ? String(r[4]).trim() : "",
                            scale: r[5] ? String(r[5]).trim() : "11-50人",
                            clientLevel: r[6] ? String(r[6]).trim() : "基础⚪",
                            intention: r[7] ? String(r[7]).trim() : "中意向⭐",
                            source: r[8] ? String(r[8]).trim() : "展会",
                            classOverride: "",
                            followUpCycleDays: "",
                            email: r[10] ? String(r[10]).trim() : "",
                            phone: r[11] ? String(r[11]).trim() : "",
                            nextFollowDate: r[12] ? String(r[12]).trim() : "",
                            nextAction: r[13] ? String(r[13]).trim() : "",
                            followHistory: r[14] ? [{ date: getToday(), note: String(r[14]).trim() }] : [],
                            deleted: false, deletedAt: null
                        });
                    }
                }
                if (confirm(`导入 ${imported.length} 条，确定替换现有客户？取消则追加`)) clients = imported;
                else clients = [...clients, ...imported];
                saveLocal();
                await saveToCloud();
                await render();
                showToast("导入成功");
            };
            reader.readAsArrayBuffer(file);
        }

        // ========== 初始化 ==========
        async function initCRM() {
            await loadFromCloud();
            await populateLinkedCustomerSelect();
            document.getElementById("searchBtn").onclick = () => { searchKeyword = document.getElementById("searchInput").value; render(); };
            document.getElementById("clearSearchBtn").onclick = () => { document.getElementById("searchInput").value = ""; searchKeyword = ""; document.getElementById("classFilter").value = ""; classFilterValue = ""; render(); };
            document.getElementById("classFilter").onchange = (e) => { classFilterValue = e.target.value; render(); };
            document.getElementById("showAddFormBtn").onclick = async () => { await resetForm(); document.getElementById("formPanel").style.display = "block"; };
            document.getElementById("cancelFormBtn").onclick = resetForm;
            document.getElementById("saveClientBtn").onclick = saveClient;
            document.getElementById("exportAllBtn").onclick = exportExcel;
            document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
            document.getElementById("importFile").onchange = (e) => { if(e.target.files[0]) importExcel(e.target.files[0]); e.target.value = ""; };
            document.getElementById("backupBtn").onclick = backupAllData;
            document.getElementById("selectAllCheckbox").onclick = (e) => document.querySelectorAll(".client-checkbox").forEach(cb => cb.checked = e.target.checked);
        }

        document.getElementById("unlockBtn").onclick = unlock;
        document.getElementById("passwordInput").addEventListener("keypress", e => { if(e.key === "Enter") unlock(); });
        document.getElementById("changePwdBtn").onclick = changePwd;

        // 页面一加载就去云端校验密码，校验完成前解锁按钮保持禁用，避免用过期本地密码误判
        (async function preloadPassword() {
            try {
                let res = await fetch(`${WORKER_URL}/bin/${BIN_ID}/latest`, { headers: { 'X-Access-Token': ACCESS_TOKEN } });
                if (res.ok) {
                    let json = await res.json();
                    let r = json.record;
                    if (r && typeof r === 'object' && r.password) {
                        currentPwd = r.password;
                        localStorage.setItem("crm_password", currentPwd);
                    }
                }
            } catch(e) { console.log('预加载密码失败，使用本地缓存密码', e); }
            let btn = document.getElementById('unlockBtn');
            btn.disabled = false;
            btn.innerText = '进入系统';
        })();
    </script>
